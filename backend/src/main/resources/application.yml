spring:
  application:
    name: logistics-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:55433/logistics_company}
    username: ${SPRING_DATASOURCE_USERNAME:logistics_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS:false}
      "[mail.smtp.ssl.checkserveridentity]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:logistics-company}
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:14}
  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    name: ${BOOTSTRAP_ADMIN_NAME:System Administrator}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  auth:
    max-failed-attempts: 5
    lock-minutes: 15
    email-from: ${SMTP_FROM:}
  cookie:
    secure: ${COOKIE_SECURE:false}
  requests:
    permanent-delete-enabled: ${PERMANENT_DELETE_ENABLED:false}
