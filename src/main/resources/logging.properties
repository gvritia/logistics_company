handlers = java.util.logging.ConsoleHandler
.level = WARNING

java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %4$s: %5$s%n

# Hibernate пишет через JBoss Logging, который без slf4j падает обратно на JUL.
# Ошибки остаются видимыми, стартовые INFO и предупреждение о встроенном
# пуле соединений в консольном меню только мешают.
org.hibernate.level = SEVERE
